<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atendimento Caqui Invest</title>
<meta name="description" content="Demonstração com dados fictícios: onde está o seu dinheiro, com data calculada, fonte e uma pessoa a um toque.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div class="carregando" id="carregando"><img src="logo/caqui-02.svg" alt="Caqui" width="658" height="272"></div>
<noscript><style>.carregando { display: none; }</style></noscript>
<div class="app">
  <header class="topo">
    <div class="topo-dentro">
      <span class="marca">Caqui<small>dados fictícios</small></span>
      <div class="demo">
        <label>Cliente <select id="cliente"></select></label>
        <label>Agora <select id="hora"></select></label>
      </div>
    </div>
  </header>
  <section class="home" id="home" aria-label="Início"></section>
  <main class="fio" id="fio" aria-live="polite"></main>
  <footer class="base">
    <div class="base-dentro">
      <div class="base-fechada" id="base-fechada">
        <button class="base-pessoa" type="button" data-fala="Quero falar com uma pessoa">Falar com uma pessoa</button>
      </div>
      <div class="base-aberta" id="base-aberta" hidden>
        <form class="campo" id="form">
          <textarea id="texto" rows="1" aria-label="Sua mensagem" placeholder="Escreva sua dúvida"></textarea>
          <button class="primario" id="enviar" type="submit">Enviar</button>
        </form>
        <nav class="saidas" aria-label="Saídas do atendimento">
          <button class="pessoa" type="button" data-fala="Quero falar com uma pessoa">Falar com uma pessoa</button>
          <button type="button" data-fala="Quero fazer uma reclamação">Reclamar</button>
          <button type="button" data-fala="Quero encerrar minha conta">Encerrar</button>
          <button type="button" data-fala="Acho que é golpe">Suspeita de golpe</button>
          <button type="button" data-fechar>Fechar</button>
        </nav>
        <p class="horario" id="horario"></p>
      </div>
    </div>
  </footer>
  <button class="orb" type="button" data-abrir aria-label="Abrir conversa" aria-expanded="false" aria-controls="base-aberta"><svg viewBox="-63 -67.2 406 406" width="60" height="60" aria-hidden="true"><circle cx="140" cy="135.8" r="203" fill="currentColor"/><g class="orb-raios"><path d="M218.02,187.97c-2.33-.17-47.28-28.98-47.78-39.3-.54-11.28,43.79,24.86,44.12,25.2,2.44,2.57,15.25,14.95,3.66,14.1Z"/><path d="M186.63,219.97c-2.17-.86-36.49-41.76-33.88-51.76,2.85-10.93,34.38,36.79,34.59,37.21,1.56,3.18,10.1,18.82-.71,14.55Z"/><path d="M62.34,187.97c2.33-.17,47.28-28.98,47.78-39.3.54-11.28-43.79,24.86-44.12,25.2-2.44,2.57-15.25,14.95-3.66,14.1Z"/><path d="M93.73,219.97c2.17-.86,36.49-41.76,33.88-51.76-2.85-10.93-34.38,36.79-34.59,37.21-1.56,3.18-10.1,18.82.71,14.55Z"/><path d="M218.02,83.69c-2.33.17-47.28,28.98-47.78,39.3-.54,11.28,43.79-24.86,44.12-25.2,2.44-2.57,15.25-14.95,3.66-14.1Z"/><path d="M186.63,51.69c-2.17.86-36.49,41.76-33.88,51.76,2.85,10.93,34.38-36.79,34.59-37.21,1.56-3.18,10.1-18.82-.71-14.55Z"/><path d="M62.34,83.69c2.33.17,47.28,28.98,47.78,39.3.54,11.28-43.79-24.86-44.12-25.2-2.44-2.57-15.25-14.95-3.66-14.1Z"/><path d="M93.73,51.69c2.17.86,36.49,41.76,33.88,51.76-2.85,10.93-34.38-36.79-34.59-37.21-1.56-3.18-10.1-18.82.71-14.55Z"/></g></svg></button>
</div>
<script type="module" src="app.js"></script>
<noscript><p>O atendimento precisa de JavaScript para conversar. Pessoas atendem das 8h às 20h.</p></noscript>
</body>
</html>
